name: Build Avanegar for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'avanegar/**'
      - '.github/workflows/avanegar-windows.yml'
  pull_request:
    paths:
      - 'avanegar/**'
      - '.github/workflows/avanegar-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: avanegar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: avanegar/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Capture interface for visual review
        run: python tools/capture_ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: Avanegar-UI
          path: avanegar/build/screenshots/
          retention-days: 14
      - name: Package desktop app
        run: python -m PyInstaller --clean --noconfirm Avanegar.spec
      - name: Smoke-test frozen application
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'dist/Avanegar/Avanegar.exe' -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) { throw "Frozen app exited prematurely with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Include guide and dependency information
        run: |
          Copy-Item README.fa.md dist/Avanegar/
          Copy-Item THIRD_PARTY.md dist/Avanegar/
      - uses: actions/upload-artifact@v4
        with:
          name: Avanegar-Windows-x64
          path: avanegar/dist/Avanegar/
          retention-days: 14
          if-no-files-found: error
