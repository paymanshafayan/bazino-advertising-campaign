# Copy this entire file to .github/workflows/build-marketing.yml
# on branch arena/01a0d4ee-bazino-gamenet-portal (via GitHub browser).
name: Build Bazino Marketing Studio

on:
  push:
    branches: ['arena/01a0d4ee-bazino-gamenet-portal']
    paths:
      - 'استودیوی تبلیغات و بازاریابی/desktop-app/src/**'
      - 'استودیوی تبلیغات و بازاریابی/desktop-app/tests/**'
      - 'استودیوی تبلیغات و بازاریابی/desktop-app/package*.json'
      - 'استودیوی تبلیغات و بازاریابی/desktop-app/BazinoMarketing.ps1'
      - 'استودیوی تبلیغات و بازاریابی/desktop-app/workflow-build-marketing.yml'
      - '.github/workflows/build-marketing.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: marketing-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'استودیوی تبلیغات و بازاریابی/desktop-app'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Node tests and syntax
        run: |
          npm test
          npm run check
      - name: PowerShell parse and plain launcher self-test
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'BazinoMarketing.ps1'),[ref]$null,[ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          $env:BAZINO_SELFTEST = '1'
          powershell -NoProfile -ExecutionPolicy Bypass -File 'BazinoMarketing.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Marketing launcher self-test failed' }
          Get-Content (Join-Path $env:TEMP 'bazino-marketing-selftest.log')
      - name: Build portable Windows ZIP (no Electron)
        shell: powershell
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe
          npm prune --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm prune failed' }
          New-Item -ItemType Directory -Force -Path stage,stage/app | Out-Null
          Invoke-PS2EXE -InputFile 'BazinoMarketing.ps1' -OutputFile 'stage/BazinoMarketing.exe' `
            -noConsole -title 'Bazino Marketing Studio' -product 'Bazino Marketing Studio' `
            -description 'Local browser marketing app; no Electron' -company 'Bazino' -version '0.2.0.0'
          Copy-Item (Get-Command node.exe).Source 'stage/node.exe'
          Copy-Item -Recurse 'src' 'stage/app/src'
          Copy-Item -Recurse 'node_modules' 'stage/app/node_modules'
          Copy-Item 'package.json' 'stage/app/package.json'
          $exe='stage/BazinoMarketing.exe'
          if ((Get-Item $exe).Length -lt 20KB) { throw 'EXE is too small' }
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Missing Windows PE header' }
          Compress-Archive -Path 'stage/*' -DestinationPath 'BazinoMarketing-Windows-x64.zip' -Force
          Write-Host ('sha256: '+(Get-FileHash 'BazinoMarketing-Windows-x64.zip' -Algorithm SHA256).Hash)
      - name: Upload artifact before GUI smoke test
        uses: actions/upload-artifact@v4
        with:
          name: BazinoMarketing-Windows-x64
          path: استودیوی تبلیغات و بازاریابی/desktop-app/BazinoMarketing-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error
      - name: Packaged app self-test (no GUI/network/OAuth)
        shell: powershell
        timeout-minutes: 2
        continue-on-error: true
        run: |
          $env:BAZINO_SELFTEST='1'
          $logPath=Join-Path $env:TEMP 'bazino-marketing-selftest.log'
          Remove-Item $logPath -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath 'stage/BazinoMarketing.exe' -PassThru
          if (-not $p.WaitForExit(45000)) { try { $p.Kill() } catch {}; throw 'EXE self-test timed out' }
          if ($p.ExitCode -ne 0) { throw ('EXE self-test failed: '+$p.ExitCode) }
          if (-not (Test-Path $logPath) -or (Get-Content $logPath -Raw) -notmatch 'SELFTEST OK') { throw 'Packaged EXE did not complete its self-test' }
          Get-Content $logPath
      - name: Summary
        shell: powershell
        run: |
          $sha=(Get-FileHash 'BazinoMarketing-Windows-x64.zip' -Algorithm SHA256).Hash
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Bazino Marketing Studio`nPortable Windows ZIP (native launcher + bundled Node; no Electron).`nSHA256: $sha`nArtifact: BazinoMarketing-Windows-x64 (30 days).`nReal account/OAuth and Windows UI still require owner-side verification."
