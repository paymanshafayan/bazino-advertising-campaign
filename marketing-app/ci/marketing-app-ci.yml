name: marketing-app-ci

# استودیوی تبلیغات و بازاریابی — برنامهٔ ویندوزی (WPF / .NET 10)          نسخهٔ ۲ (گزارش‌دهی به داخل مخزن)
# محل نهایی این فایل: .github/workflows/marketing-app-ci.yml  (توکن ایجنت اجازهٔ نوشتن در .github/workflows را ندارد؛ مالک یک‌بار کپی می‌کند)
# - core-tests: روی هر push این شاخه (اوبونتو، ارزان).
# - windows-build: فقط وقتی پیام کامیت شامل [build] باشد، یا خودِ این فایل در همان push تغییر کرده باشد، یا دستی اجرا شود.
#   خروجی به‌جای Artifact در یک Pre-release گذاشته می‌شود (Artifactها سهمیهٔ ذخیره‌سازی را پر می‌کردند).
# - چون ایجنت نه لاگ Actions را می‌تواند بخواند و نه فایل‌های Release را دانلود کند، هر دو job در پایان یک «گزارش» (اسکرین‌شات‌ها،
#   دنبالهٔ لاگ‌ها، نتیجهٔ هر مرحله) را در پوشهٔ marketing-app/ci-reports/latest همین شاخه کامیت می‌کنند. آن push با GITHUB_TOKEN
#   انجام می‌شود و هیچ اجرای تازه‌ای راه نمی‌اندازد (و پوشهٔ گزارش از فیلتر paths هم خارج است).

on:
  push:
    branches: [arena/01a0f126-bazino-gamenet-portal]
    paths:
      - "استودیوی تبلیغات و بازاریابی/marketing-app/**"
      - "!استودیوی تبلیغات و بازاریابی/marketing-app/ci-reports/**"
      - ".github/workflows/marketing-app-ci.yml"
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build the Windows EXE, render screenshots, publish a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: marketing-app-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: استودیوی تبلیغات و بازاریابی/marketing-app
  REPORT_DIR: استودیوی تبلیغات و بازاریابی/marketing-app/ci-reports/latest
  TARGET_BRANCH: arena/01a0f126-bazino-gamenet-portal
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore + test
        id: test
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p out/logs
          dotnet --info | head -n 20
          dotnet restore tests/BazinoMarketing.Core.Tests/BazinoMarketing.Core.Tests.csproj | tee out/logs/linux-restore.txt
          set +e
          dotnet test tests/BazinoMarketing.Core.Tests/BazinoMarketing.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" -v minimal | tee out/logs/linux-test.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            grep -nE "^\s+Failed |error [A-Z]+[0-9]+|Assert\.|Exception" out/logs/linux-test.txt | head -n 40 | sed 's/^/::error title=core-tests::/'
            exit "$code"
          fi

      # Cross-target compile of the WPF project (build only; cannot run on Linux). Informational: catches C#/XAML errors
      # before spending Windows minutes. Failure here does not block the Windows job.
      - name: Compile WPF app (cross-target check)
        id: wpf
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: |
          mkdir -p out/logs
          dotnet build src/BazinoMarketing.App/BazinoMarketing.App.csproj -c Release -p:EnableWindowsTargeting=true -v minimal | tee out/logs/linux-wpf-build.txt

      # Only when something failed: put the log tails into the repo so the agent can read them.
      - name: Report back to the repository (on failure)
        if: failure() || steps.wpf.outcome == 'failure'
        env:
          RUN_INFO: "run ${{ github.run_number }} (${{ github.run_id }}) on ${{ github.sha }} — event ${{ github.event_name }}"
          OUTCOMES: "test=${{ steps.test.outcome }} wpf-cross-compile=${{ steps.wpf.outcome }}"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          src="$APP_DIR/out/logs"
          rm -rf "$REPORT_DIR/linux"
          mkdir -p "$REPORT_DIR/linux"
          {
            echo "# Linux job report"
            echo
            echo "- $RUN_INFO"
            echo "- steps: $OUTCOMES"
            echo "- generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$REPORT_DIR/linux/summary.md"
          for f in linux-restore.txt linux-test.txt linux-wpf-build.txt; do
            [ -f "$src/$f" ] && tail -n 400 "$src/$f" > "$REPORT_DIR/linux/$f" || true
          done
          git add -A -- "$REPORT_DIR"
          git commit -m "ci(marketing-app): linux report for run ${{ github.run_number }} [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git push origin "HEAD:$TARGET_BRANCH" && break
            git fetch origin "$TARGET_BRANCH" && git rebase "origin/$TARGET_BRANCH"
          done

  windows-build:
    name: Windows build + screenshots + pre-release
    needs: core-tests
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.build_windows ||
      github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.added, '.github/workflows/marketing-app-ci.yml') ||
      contains(github.event.head_commit.modified, '.github/workflows/marketing-app-ci.yml'))
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test (Windows, includes DPAPI round-trip)
        id: test
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/logs | Out-Null
          dotnet test tests/BazinoMarketing.Core.Tests/BazinoMarketing.Core.Tests.csproj -c Release -v minimal | Tee-Object -FilePath out/logs/win-test.txt
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path out/logs/win-test.txt -Pattern '^\s+Failed |error [A-Z]+\d+|Assert\.|Exception' | Select-Object -First 40 | ForEach-Object { "::error title=windows-tests::$($_.Line)" }
            throw "tests failed with exit code $LASTEXITCODE"
          }

      - name: Publish self-contained single-file EXE
        id: publish
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/logs | Out-Null
          dotnet publish src/BazinoMarketing.App/BazinoMarketing.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false -o out/publish | Tee-Object -FilePath out/logs/win-publish.txt
          if ($LASTEXITCODE -ne 0) { throw "publish failed with exit code $LASTEXITCODE" }
          Get-ChildItem out/publish | Format-Table Name, Length

      - name: Render screenshots (offscreen, sample data)
        id: render
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/shots, out/logs | Out-Null
          $exe = (Resolve-Path out/publish/BazinoMarketing.exe).Path
          $dir = (Resolve-Path out/shots).Path
          $p = Start-Process -FilePath $exe -ArgumentList "--render-screenshots `"$dir`"" -PassThru
          if (-not $p.WaitForExit(300000)) { try { $p.Kill() } catch {}; "::error title=marketing-app render::renderer did not exit within 5 minutes (a dialog or deadlock?)"; throw "renderer timed out" }
          "renderer exit code: $($p.ExitCode)" | Tee-Object -FilePath out/logs/win-render.txt
          Get-ChildItem out/shots | Format-Table Name, Length | Out-String | Tee-Object -FilePath out/logs/win-render.txt -Append
          # These files start with a GitHub workflow command line (::notice / ::error), so printing them creates readable annotations.
          if (Test-Path out/shots/render-error.txt) { Get-Content out/shots/render-error.txt | Tee-Object -FilePath out/logs/win-render.txt -Append }
          if (Test-Path out/shots/render-info.txt)  { Get-Content out/shots/render-info.txt  | Tee-Object -FilePath out/logs/win-render.txt -Append }
          $crash = Join-Path $env:TEMP 'BazinoMarketing-crash.log'
          if (Test-Path $crash) { "--- crash log ---"; Get-Content $crash | Tee-Object -FilePath out/logs/win-crash.txt }
          $pngs = @(Get-ChildItem out/shots -Filter *.png)
          if ($pngs.Count -lt 3) { throw "expected at least 3 screenshots, got $($pngs.Count)" }
          if ($p.ExitCode -ne 0) { throw "renderer failed with exit code $($p.ExitCode)" }

      - name: Package
        id: package
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $rel = Join-Path $env:GITHUB_WORKSPACE 'release-out'
          New-Item -ItemType Directory -Force $rel | Out-Null
          Copy-Item out/publish/BazinoMarketing.exe $rel/BazinoMarketing.exe
          Copy-Item out/shots/*.png $rel/
          Copy-Item out/shots/render-info.txt $rel/ -ErrorAction SilentlyContinue
          Push-Location $rel
          Get-ChildItem -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Pre-release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: marketing-app-dev-${{ github.run_number }}
          name: Marketing app dev build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Bazino Marketing Studio — development build (unsigned, Windows x64, self-contained).
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Assets: BazinoMarketing.exe, SHA256SUMS.txt, screenshots rendered from sample data (no real keys).
          files: |
            release-out/BazinoMarketing.exe
            release-out/SHA256SUMS.txt
            release-out/*.png
            release-out/render-info.txt

      # Always: screenshots + log tails + step outcomes go into the repo (the only channel the agent can read).
      - name: Report back to the repository
        if: always()
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          OUT_TEST: ${{ steps.test.outcome }}
          OUT_PUBLISH: ${{ steps.publish.outcome }}
          OUT_RENDER: ${{ steps.render.outcome }}
          OUT_PACKAGE: ${{ steps.package.outcome }}
          OUT_RELEASE: ${{ steps.release.outcome }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin $env:TARGET_BRANCH
          git checkout -B $env:TARGET_BRANCH "origin/$env:TARGET_BRANCH"
          $app = Join-Path $env:GITHUB_WORKSPACE $env:APP_DIR
          $report = Join-Path $env:GITHUB_WORKSPACE $env:REPORT_DIR
          $win = Join-Path $report 'windows'
          if (Test-Path $win) { Remove-Item $win -Recurse -Force }
          New-Item -ItemType Directory -Force $win | Out-Null
          $shots = Join-Path $app 'out/shots'
          if (Test-Path $shots) {
            Get-ChildItem $shots -Filter *.png | Copy-Item -Destination $win
            Get-ChildItem $shots -Filter *.txt | Copy-Item -Destination $win
          }
          $logs = Join-Path $app 'out/logs'
          if (Test-Path $logs) {
            Get-ChildItem $logs -Filter *.txt | ForEach-Object { Get-Content $_.FullName -Tail 400 | Set-Content -Encoding utf8 (Join-Path $win $_.Name) }
          }
          $exeSize = if (Test-Path (Join-Path $app 'out/publish/BazinoMarketing.exe')) { (Get-Item (Join-Path $app 'out/publish/BazinoMarketing.exe')).Length } else { 0 }
          @(
            "# Windows job report",
            "",
            "- run $env:RUN_NUMBER ($env:RUN_ID) on $env:SHA — event $env:EVENT",
            "- steps: test=$env:OUT_TEST publish=$env:OUT_PUBLISH render=$env:OUT_RENDER package=$env:OUT_PACKAGE release=$env:OUT_RELEASE",
            "- release: $(if ($env:RELEASE_URL) { $env:RELEASE_URL } else { '(none)' })",
            "- exe size: $exeSize bytes",
            "- generated: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))",
            "",
            "Files in this folder: PNG screenshots (sample data), render-info/render-error, tails of the test/publish/render logs."
          ) | Set-Content -Encoding utf8 (Join-Path $win 'summary.md')
          Get-ChildItem $win | Format-Table Name, Length

          git add -A -- $env:REPORT_DIR
          git commit -m "ci(marketing-app): windows report for run $env:RUN_NUMBER [skip ci]"
          if ($LASTEXITCODE -ne 0) { "nothing to commit"; exit 0 }
          foreach ($i in 1..3) {
            git push origin "HEAD:$env:TARGET_BRANCH"
            if ($LASTEXITCODE -eq 0) { break }
            git fetch origin $env:TARGET_BRANCH
            git rebase "origin/$env:TARGET_BRANCH"
          }
          exit 0
